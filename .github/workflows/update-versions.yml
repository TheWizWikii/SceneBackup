name: Actualizar versiones

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer releases de GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_versions.py

      - name: Guardar cambios
        run: |
          git config user.name "scene-backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/games.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizar versiones desde GitHub"
            git push
          fi
